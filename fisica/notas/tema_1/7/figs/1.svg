 x="262" y="128" fill="#fff" text-anchor="middle" font-size="22" font-weight="bold">N</text><text x="338" y="128" fill="#fff" text-anchor="middle" font-size="22" font-weight="bold">S</text><text x="300" y="16" fill="#2563eb" text-anchor="middle" font-size="15" font-weight="bold">líneas del campo magnético (B)</text><text x="300" y="244" fill="#222" text-anchor="middle" font-size="14">N = polo norte, S = polo sur. Fuera del imán, las líneas salen del norte y entran por el sur.</text><text x="300" y="264" fill="#222" text-anchor="middle" font-size="14">Son líneas cerradas: no existen polos sueltos.</text></svg>