<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <rect width="760" height="300" fill="#ffffff"/>

  <!-- Título -->
  <text x="380" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Notación científica: desplazamiento de la coma decimal</text>

  <!-- ========== LADO IZQUIERDO: número grande ========== -->
  <text x="185" y="65" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">Exponente POSITIVO → número GRANDE</text>

  <!-- Número con coma resaltada -->
  <text x="185" y="115" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#1e293b" text-anchor="middle">300 000 000</text>
  <text x="185" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">m/s (velocidad de la luz)</text>

  <!-- Flecha hacia abajo -->
  <line x1="185" y1="150" x2="185" y2="175" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Resultado -->
  <rect x="90" y="185" width="190" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="185" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#2563eb" text-anchor="middle">3 × 10⁸ m/s</text>
  <text x="185" y="228" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">coma se mueve 8 puestos a la izquierda</text>

  <!-- Indicador -->
  <text x="185" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">n = +8  →  número grande</text>

  <!-- Divisor vertical -->
  <line x1="380" y1="45" x2="380" y2="285" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ========== LADO DERECHO: número pequeño ========== -->
  <text x="570" y="65" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">Exponente NEGATIVO → número PEQUEÑO</text>

  <!-- Número con coma resaltada -->
  <text x="570" y="110" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">0,000 000 000 1</text>
  <text x="570" y="133" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">m (tamaño de un átomo)</text>

  <!-- Flecha hacia abajo -->
  <line x1="570" y1="145" x2="570" y2="175" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Resultado -->
  <rect x="470" y="185" width="200" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="570" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#dc2626" text-anchor="middle">1 × 10⁻¹⁰ m</text>
  <text x="570" y="228" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">coma se mueve 10 puestos a la derecha</text>

  <!-- Indicador -->
  <text x="570" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">n = -10  →  número diminuto</text>

  <!-- Regla común abajo -->
  <rect x="140" y="277" width="480" height="20" rx="4" fill="#f8fafc"/>
  <text x="380" y="291" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Regla: el número delante de «× 10» siempre está entre 1 y 9,99…</text>
</svg>
