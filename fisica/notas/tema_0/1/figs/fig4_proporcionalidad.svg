<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320">
  <rect width="760" height="320" fill="#ffffff"/>

  <!-- Título -->
  <text x="380" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Proporcionalidad directa e inversa</text>

  <!-- ===== GRÁFICA IZQUIERDA: Directa ===== -->
  <text x="185" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">Directamente proporcional</text>
  <text x="185" y="75" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">y = k · x</text>

  <!-- Ejes -->
  <line x1="60" y1="270" x2="310" y2="270" stroke="#555555" stroke-width="1.5"/>
  <line x1="60" y1="270" x2="60" y2="95" stroke="#555555" stroke-width="1.5"/>
  <!-- Flechas ejes -->
  <polygon points="310,266 322,270 310,274" fill="#555555"/>
  <polygon points="56,95 60,83 64,95" fill="#555555"/>

  <!-- Etiquetas ejes -->
  <text x="320" y="274" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">x</text>
  <text x="48" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555" text-anchor="middle">y</text>

  <!-- Línea recta directa -->
  <line x1="60" y1="270" x2="305" y2="100" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Puntos ejemplo -->
  <circle cx="120" cy="228" r="5" fill="#2563eb"/>
  <circle cx="180" cy="185" r="5" fill="#2563eb"/>
  <circle cx="240" cy="143" r="5" fill="#2563eb"/>

  <!-- Líneas guía -->
  <line x1="60" y1="228" x2="120" y2="228" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="120" y1="228" x2="120" y2="270" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="60" y1="185" x2="180" y2="185" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="180" y1="185" x2="180" y2="270" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Anotaciones guía -->
  <text x="55" y="232" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" text-anchor="end">y₁</text>
  <text x="55" y="188" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" text-anchor="end">2y₁</text>
  <text x="120" y="283" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">x₁</text>
  <text x="180" y="283" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">2x₁</text>

  <!-- Etiqueta -->
  <rect x="215" y="115" width="85" height="30" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="257" y="135" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">Si x×2 → y×2</text>

  <!-- Ejemplo clínico -->
  <text x="185" y="300" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Ej.: mA × 2 → fotones × 2</text>

  <!-- Divisor -->
  <line x1="380" y1="45" x2="380" y2="305" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===== GRÁFICA DERECHA: Inversa ===== -->
  <text x="570" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">Inversamente proporcional</text>
  <text x="570" y="75" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">y = k / x</text>

  <!-- Ejes -->
  <line x1="430" y1="270" x2="720" y2="270" stroke="#555555" stroke-width="1.5"/>
  <line x1="430" y1="270" x2="430" y2="95" stroke="#555555" stroke-width="1.5"/>
  <polygon points="720,266 732,270 720,274" fill="#555555"/>
  <polygon points="426,95 430,83 434,95" fill="#555555"/>
  <text x="735" y="274" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">x</text>
  <text x="418" y="82" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555" text-anchor="middle">y</text>

  <!-- Curva hipérbola (aproximada con segmentos) -->
  <polyline points="440,105 450,112 460,122 475,137 495,153 520,168 550,183 585,196 625,207 670,216 710,222" fill="none" stroke="#dc2626" stroke-width="2.5"/>

  <!-- Puntos ejemplo -->
  <circle cx="460" cy="122" r="5" fill="#dc2626"/>
  <circle cx="520" cy="168" r="5" fill="#dc2626"/>
  <circle cx="650" cy="212" r="5" fill="#dc2626"/>

  <!-- Líneas guía -->
  <line x1="430" y1="122" x2="460" y2="122" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="460" y1="122" x2="460" y2="270" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="430" y1="168" x2="520" y2="168" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="520" y1="168" x2="520" y2="270" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="425" y="126" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" text-anchor="end">y₁</text>
  <text x="425" y="172" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" text-anchor="end">y₁/2</text>
  <text x="460" y="283" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">x₁</text>
  <text x="520" y="283" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">2x₁</text>

  <!-- Etiqueta -->
  <rect x="610" y="115" width="95" height="30" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="657" y="135" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">Si x×2 → y÷2</text>

  <!-- Ejemplo clínico -->
  <text x="570" y="300" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Ej.: f × 2 → λ ÷ 2</text>
</svg>
